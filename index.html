}

/* ---------- 가입·로그인 (성인 확인) ---------- */
function vJoin(){
  const J=S.join;barSub(J.step==='start'?'로그인·가입':'회원가입');
  const stepBar=n=>`<div class="steps" aria-label="4단계 중 ${n}단계">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
  if(J.step==='done'&&!S.user)J.step='start';
  if(S.user&&J.step==='start'){go('my');return}
  if(J.step==='start'){
    view.innerHTML=`<div class="join-hero"><h2>여행 이야기,<br>놀판에서 나눠요</h2><p>만 19세 이상만 가입할 수 있어요. 처음이면 가입, 이미 회원이면 같은 버튼으로 로그인돼요.</p></div>
    <div class="social"><button class="sbtn kakao" type="button" data-via="카카오"><span class="mk">K</span>카카오로 시작하기</button><button class="sbtn naver" type="button" data-via="네이버"><span class="mk">N</span>네이버로 시작하기</button><button class="sbtn mail" type="button" data-via="이메일">이메일로 가입하기</button></div>
    <p class="note">데모라서 실제 카카오·네이버 계정에 연결하지 않아요. 누르면 가입 흐름을 그대로 보여 드려요.</p>
    <div style="padding:20px"><button class="btn block" type="button" data-demo>데모 회원으로 바로 둘러보기</button></div>`;
    view.onclick=e=>{const v=e.target.closest('[data-via]');if(v){const via=v.dataset.via;
        if(via==='이메일'){J.via=via;J.step='terms';return vJoin()}
        sheet(`<h3>${via} 계정으로 계속할까요?</h3><p>실제 서비스에서는 ${via} 로그인 창이 열리고, 닉네임·이메일 제공에 동의하면 돌아와요. 데모에서는 바로 다음 단계로 넘어가요.</p><div class="btns"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" data-x>동의하고 계속하기</button></div>`,ev=>{if(ev.target.closest('[data-x]')){J.via=via;J.step='terms';closeLayer();vJoin()}});return}
      if(e.target.closest('[data-demo]')){login('은퇴후여행');go('home');setTimeout(()=>toast('은퇴후여행 님, 반가워요'),50)}};
    return}
  if(J.step==='terms'){
    const items=[['age','만 19세 이상이에요',true],['tos','이용약관 동의',true],['priv','개인정보 수집·이용 동의',true],['mkt','이벤트·혜택 알림 받기',false]];
    const all=items.every(i=>J.agree[i[0]]);const req=items.filter(i=>i[2]).every(i=>J.agree[i[0]]);
    view.innerHTML=`${stepBar(1)}<div class="join-hero"><h2>약관에 동의해 주세요</h2><p>${esc(J.via)}로 가입하고 있어요.</p></div>
    <div class="pad"><div class="checks"><label class="ck all"><input type="checkbox" data-all ${all?'checked':''}><span>모두 동의하기</span></label>
    ${items.map(([k,l,r])=>`<label class="ck"><input type="checkbox" data-ag="${k}" ${J.agree[k]?'checked':''}><span>${l} <small>${r?'(필수)':'(선택)'}</small></span>${k==='tos'||k==='priv'?`<button class="view" type="button" data-doc="${k}">보기</button>`:''}</label>`).join('')}</div></div>
    <div class="bottom-cta"><button class="btn primary block" type="button" data-next ${req?'':'disabled'}>다음</button></div>`;
    view.onclick=e=>{const t=e.target;
      if(t.closest('[data-doc]')){e.preventDefault();return docSheet(t.closest('[data-doc]').dataset.doc)}
      if(t.matches('[data-all]')){items.forEach(i=>J.agree[i[0]]=t.checked);return vJoin()}
      if(t.matches('[data-ag]')){J.agree[t.dataset.ag]=t.checked;return vJoin()}
      if(t.closest('[data-next]')){J.step='birth';vJoin()}};
    return}
  if(J.step==='birth'){
    const y=TODAY.getFullYear();
    view.innerHTML=`${stepBar(2)}<div class="join-hero"><h2>생년월일을 알려 주세요</h2><p>만 19세 미만은 가입할 수 없어요.</p></div>
    <div class="pad"><div class="field"><span class="lab">생년월일 <span class="req">*</span></span><div class="birth">
      <label class="sr" for="by">태어난 해</label><select class="inp" id="by"><option value="">연도</option>${Array.from({length:90},(_,i)=>y-i).map(v=>`<option value="${v}" ${J.birth&&J.birth[0]==v?'selected':''}>${v}년</option>`).join('')}</select>
      <label class="sr" for="bm">태어난 달</label><select class="inp" id="bm"><option value="">월</option>${Array.from({length:12},(_,i)=>i+1).map(v=>`<option value="${v}" ${J.birth&&J.birth[1]==v?'selected':''}>${v}월</option>`).join('')}</select>
      <label class="sr" for="bd">태어난 날</label><select class="inp" id="bd"><option value="">일</option>${Array.from({length:31},(_,i)=>i+1).map(v=>`<option value="${v}" ${J.birth&&J.birth[2]==v?'selected':''}>${v}일</option>`).join('')}</select>
    </div><div class="errmsg" id="eB" hidden></div></div></div>
    <p class="note"><b>실제 서비스에서는</b> 휴대폰 본인인증(PASS 등)으로 생년월일을 받아서, 직접 입력보다 확실하게 막을 수 있어요. 어떤 방식으로 할지는 미팅에서 정해요.</p>
    <div class="bottom-cta"><button class="btn primary block" type="button" data-check>나이 확인하기</button></div>`;
    view.onclick=e=>{if(!e.target.closest('[data-check]'))return;const by=+$('#by').value,bm=+$('#bm').value,bd=+$('#bd').value,er=$('#eB');
      if(!by||!bm||!bd){er.hidden=false;er.textContent='연도, 월, 일을 모두 골라 주세요';return}
      const dt=new Date(by,bm-1,bd);if(dt.getMonth()!==bm-1){er.hidden=false;er.textContent=`${bm}월에는 ${bd}일이 없어요. 날짜를 다시 골라 주세요`;return}
      let age=TODAY.getFullYear()-by;if(TODAY.getMonth()<bm-1||(TODAY.getMonth()===bm-1&&TODAY.getDate()<bd))age--;
      J.birth=[by,bm,bd];J.age=age;J.step=age>=19?'nick':'blocked';vJoin()};
    return}
  if(J.step==='blocked'){
    view.innerHTML=`<div class="blocked"><div class="mark">19</div><h2>만 19세 이상만 가입할 수 있어요</h2><p>입력한 생년월일로는 만 ${J.age}세예요.<br>놀판은 성인 회원만 이용하는 커뮤니티예요.</p><p style="font-size:.9rem;color:var(--mut)">가입 정보는 저장하지 않았어요.</p><button class="btn block" type="button" data-home style="margin-top:16px">홈으로 가기</button></div>`;
    view.onclick=e=>{if(e.target.closest('[data-home]')){S.join={step:'start',via:'',birth:null,agree:{}};go('home')}};return}
  if(J.step==='nick'){
    view.innerHTML=`${stepBar(3)}<div class="join-hero"><h2>나이 확인이 끝났어요</h2><p>만 ${J.age}세로 확인했어요. 이제 커뮤니티에서 쓸 닉네임을 정해 주세요.</p></div>
    <div class="pad"><div class="field"><label for="nk">닉네임 <span class="req">*</span></label><input class="inp" id="nk" maxlength="10" placeholder="2~10자, 한글·영문·숫자" value="${esc(J.nick||'')}"><div class="help" id="nh">다른 회원에게 보이는 이름이에요. 나중에 바꿀 수 있어요.</div></div></div>
    <div class="bottom-cta"><button class="btn primary block" type="button" data-done>가입 마치기</button></div>`;
    view.onclick=e=>{if(!e.target.closest('[data-done]'))return;const v=$('#nk').value.trim(),h=$('#nh'),i=$('#nk');
      const bad=m=>{h.className='errmsg';h.textContent=m;i.classList.add('err');i.focus()};
      if(v.length<2)return bad('닉네임을 2자 이상 써 주세요');
      if(!/^[가-힣a-zA-Z0-9]+$/.test(v))return bad('한글, 영문, 숫자만 쓸 수 있어요. 띄어쓰기도 빼 주세요');
      if(MEMBERS.some(m=>m.nick===v))return bad(`'${v}'은(는) 이미 쓰는 닉네임이에요. 다른 이름을 골라 주세요`);
      MEMBERS.unshift({nick:v,joined:fmtD(TODAY),posts:0,cmts:0,reports:0,status:'ok'});J.step='done';login(v);vJoin()};
    return}
  if(J.step==='done'){
    view.innerHTML=`${stepBar(4)}<div class="join-hero"><h2>${esc(S.user.nick)} 님,<br>가입을 환영해요</h2><p>해외여행·국내여행·여행 라운지에서 이야기를 나눠 보세요.</p></div><div class="pad"><button class="btn primary block" type="button" data-go="home">홈으로 가기</button><div style="height:12px"></div><button class="btn block" type="button" data-w>첫 글 쓰기</button></div>`;
    view.onclick=e=>{if(e.target.closest('[data-w]')){S.join.step='start';startWrite('lounge','자유수다','')}else if(e.target.closest('[data-go]'))S.join.step='start'};
  }
}
function fmtD(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function login(nick){S.user={nick,posts:POSTS.filter(p=>p.author===nick).map(p=>p.id),cmts:[]};POSTS.forEach(p=>p.comments.forEach(c=>{if(c.author===nick)S.user.cmts.push({post:p.id,text:c.text});c.replies.forEach(r=>{if(r.author===nick)S.user.cmts.push({post:p.id,text:r.text})})}))}
function docSheet(k){sheet(k==='tos'?`<h3>이용약관 (예시)</h3><p>제1조 이 약관은 놀판 커뮤니티 이용 조건을 정해요.<br>제2조 회원은 만 19세 이상이어야 해요.<br>제3조 광고·도배·욕설 글은 안내 없이 가려질 수 있어요.<br><br>실제 약관 문구는 발주사에서 정해 주시면 그대로 넣어요.</p><div class="btns one"><button class="btn" type="button" data-close>닫기</button></div>`:`<h3>개인정보 수집·이용 (예시)</h3><p>모으는 항목: 닉네임, 이메일, 생년월일(나이 확인용)<br>쓰는 곳: 회원 관리, 성인 여부 확인<br>보관 기간: 탈퇴하면 바로 지워요(법에서 정한 기록은 정해진 기간만).</p><div class="btns one"><button class="btn" type="button" data-close>닫기</button></div>`)}

/* ---------- 내 정보 ---------- */
function vMy(){
  barSub('내 정보');
  if(!S.user){view.innerHTML=`<div class="join-hero"><h2>로그인하고<br>여행 이야기를 나눠요</h2><p>글쓰기, 댓글, 좋아요는 회원만 할 수 있어요.</p></div><div class="social"><button class="btn primary block" type="button" data-go="join">로그인·가입하기</button></div>
    <ul class="menu"><li><div class="rowx"><span style="flex:1">글자 크기</span><div class="fsseg" data-fsseg>${fsSeg()}</div></div></li><li><button type="button" data-go="admin">${ic('shield')}<span>관리자 화면 (데모 바로가기)</span>${ic('right')}</button></li></ul>`;bindMy();return}
  const u=S.user,mine=POSTS.filter(p=>u.posts.includes(p.id)&&vis(p)),liked=POSTS.filter(p=>p.liked&&vis(p));
  const tabs=[['posts','내 글',mine.length],['cmts','내 댓글',u.cmts.length],['likes','좋아요',liked.length]];
  view.innerHTML=`<div class="profile"><span class="ava">${esc(u.nick[0])}</span><div style="flex:1;min-width:0"><b>${esc(u.nick)}</b><small>성인 확인 완료<br>가입 ${MEMBERS.find(m=>m.nick===u.nick)?.joined||''}</small></div><button class="btn sm" type="button" data-nick>닉네임 바꾸기</button></div>
  <div class="seg" style="margin:0 16px 12px">${tabs.map(([k,l,n])=>`<button type="button" data-mt="${k}" aria-pressed="${S.myTab===k}">${l} ${n}</button>`).join('')}</div>
  <div style="margin:0 16px 16px;border:1px solid var(--line-2);border-radius:20px;overflow:hidden;background:var(--card)">${
    S.myTab==='posts'?(mine.length?`<ul class="list">${mine.map(rowHTML).join('')}</ul>`:'<div class="empty"><strong>아직 쓴 글이 없어요</strong>여행 이야기를 처음으로 남겨 보세요.</div>'):
    S.myTab==='cmts'?(u.cmts.length?`<ul class="list">${u.cmts.map(c=>{const p=POSTS.find(x=>x.id===c.post);return `<li><button class="prow" type="button" data-go="post/${c.post}"><span class="t"><b>${esc(c.text)}</b><span class="meta"><span>${esc(p?p.title:'삭제된 글')}</span></span></span></button></li>`}).join('')}</ul>`:'<div class="empty"><strong>아직 쓴 댓글이 없어요</strong></div>'):
    (liked.length?`<ul class="list">${liked.map(rowHTML).join('')}</ul>`:'<div class="empty"><strong>좋아요한 글이 없어요</strong>마음에 드는 글에 하트를 눌러 보세요.</div>')}</div>
  <ul class="menu">
    <li><div class="rowx"><span style="flex:1">글자 크기</span><div class="fsseg" data-fsseg>${fsSeg()}</div></div></li>
    <li><button type="button" data-doc="tos">${ic('doc')}<span>이용약관</span>${ic('right')}</button></li>
    <li><button type="button" data-doc="priv">${ic('doc')}<span>개인정보 처리방침</span>${ic('right')}</button></li>
    <li><button type="button" data-go="admin">${ic('shield')}<span>관리자 화면 (데모 바로가기)</span>${ic('right')}</button></li>
  </ul>
  <ul class="menu"><li><button type="button" data-logout>${ic('out')}<span>로그아웃</span></button></li><li><button class="danger" type="button" data-leave>${ic('x')}<span>회원 탈퇴</span></button></li></ul>${foot()}`;
  bindMy();
}
function bindMy(){view.onclick=e=>{const t=e.target;
  const f=t.closest('[data-fsseg] [data-fs]');if(f)return setFs(f.dataset.fs);
  const mt=t.closest('[data-mt]');if(mt){S.myTab=mt.dataset.mt;return vMy()}
  const d=t.closest('[data-doc]');if(d)return docSheet(d.dataset.doc);
  if(t.closest('[data-logout]')){S.user=null;toast('로그아웃했어요');return vMy()}
  if(t.closest('[data-nick]'))return sheet(`<h3>닉네임 바꾸기</h3><div class="field"><label for="nn">새 닉네임</label><input class="inp" id="nn" maxlength="10" value="${esc(S.user.nick)}"><div class="help" id="nnh">2~10자, 한글·영문·숫자</div></div><div class="btns"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" data-x>바꾸기</button></div>`,ev=>{if(!ev.target.closest('[data-x]'))return;const v=$('#nn').value.trim(),h=$('#nnh');
      if(v.length<2||!/^[가-힣a-zA-Z0-9]+$/.test(v)){h.className='errmsg';h.textContent='2~10자 한글·영문·숫자로 써 주세요';return}
      if(v!==S.user.nick&&MEMBERS.some(m=>m.nick===v)){h.className='errmsg';h.textContent='이미 쓰는 닉네임이에요';return}
      const old=S.user.nick;const m=MEMBERS.find(m=>m.nick===old);m&&(m.nick=v);POSTS.forEach(p=>{if(p.author===old)p.author=v;p.comments.forEach(c=>{if(c.author===old)c.author=v;c.replies.forEach(r=>{if(r.author===old)r.author=v})})});S.user.nick=v;closeLayer();vMy();toast('닉네임을 바꿨어요')});
  if(t.closest('[data-leave]'))return sheet(`<h3>정말 탈퇴할까요?</h3><p>탈퇴하면 회원 정보는 바로 지워요. 쓴 글과 댓글은 남고, 글쓴이는 '탈퇴한 회원'으로 바뀌어요.</p><label class="ck" style="padding:0;margin-bottom:12px"><input type="checkbox" id="lv"><span>위 내용을 확인했어요</span></label><div class="btns"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" data-x style="background:var(--bad);border-color:var(--bad)">탈퇴하기</button></div>`,ev=>{if(!ev.target.closest('[data-x]'))return;if(!$('#lv').checked){toast('확인 칸에 체크해 주세요');return}
      const old=S.user.nick;MEMBERS=MEMBERS.filter(m=>m.nick!==old);POSTS.forEach(p=>{if(p.author===old)p.author='탈퇴한 회원';p.comments.forEach(c=>{if(c.author===old)c.author='탈퇴한 회원';c.replies.forEach(r=>{if(r.author===old)r.author='탈퇴한 회원'})})});S.user=null;closeLayer();go('home');setTimeout(()=>toast('탈퇴했어요. 그동안 고마웠어요'),50)});
}}

/* ---------- 관리자 ---------- */
const ST={ok:['정상','ok'],stop:['이용 정지','warn'],ban:['영구 차단','bad']};
function vAdmin(){
  barSub('관리자');
  const reported=POSTS.filter(p=>vis(p)&&p.reports>0&&!p.blind).length+POSTS.reduce((a,p)=>a+p.comments.filter(c=>c.reports>0&&!c.blind).length,0);
  const tabs=[['members','회원'],['posts','글·댓글'],['notice','공지'],['banner','배너']];
  view.innerHTML=`<div class="adm-top"><h2>관리자</h2><p>데모라 누구나 들어올 수 있어요. 실제로는 관리자 계정만 열려요.</p>
    <div class="kpis"><div class="kpi hot"><small>처리할 신고</small><b>${reported}</b>건</div><div class="kpi"><small>전체 회원</small><b>${MEMBERS.length}</b>명</div><div class="kpi"><small>오늘 새 글</small><b>${POSTS.filter(p=>vis(p)&&p.ago<1440).length}</b>개</div><div class="kpi"><small>켜진 배너</small><b>${BANNERS.filter(b=>b.on).length}</b>개</div></div>
    <div class="seg" style="margin:0">${tabs.map(([k,l])=>`<button type="button" data-at="${k}" aria-pressed="${S.admTab===k}">${l}</button>`).join('')}</div></div>
  <div id="adm"></div>`;
  ({members:admMembers,posts:admPosts,notice:admNotice,banner:admBanner})[S.admTab]();
  view.onclick=admClick;
}
function admMembers(){
  const cnt=k=>k==='all'?MEMBERS.length:MEMBERS.filter(m=>m.status===k).length;
  const list=MEMBERS.filter(m=>S.memFilter==='all'||m.status===S.memFilter);
  $('#adm').innerHTML=`<div class="chips" style="padding:12px 16px">${[['all','전체'],['ok','정상'],['stop','정지'],['ban','차단']].map(([k,l])=>`<button class="chip" type="button" data-mf="${k}" aria-pressed="${S.memFilter===k}">${l} ${cnt(k)}</button>`).join('')}</div>
  <ul class="alist">${list.map(m=>`<li class="arow"><span class="ava sm">${esc(m.nick[0])}</span><div class="t"><b>${esc(m.nick)}</b><small>가입 ${m.joined} · 글 ${m.posts} · 댓글 ${m.cmts}${m.reports?` · 신고 ${m.reports}`:''}${m.until?` · ${m.until}까지`:''}${m.reason?` · 사유: ${esc(m.reason)}`:''}</small></div><span class="tag ${ST[m.status][1]}">${ST[m.status][0]}</span><div class="acts">${m.status==='ok'?`<button class="btn sm" type="button" data-sus="${esc(m.nick)}">정지·차단</button>`:`<button class="btn sm" type="button" data-unsus="${esc(m.nick)}">풀어 주기</button>`}</div></li>`).join('')||'<li class="empty"><strong>해당하는 회원이 없어요</strong></li>'}</ul>`;
}
function admPosts(){
  let list=POSTS.filter(vis);if(S.postFilter==='reported')list=list.filter(p=>p.reports>0||p.blind);
  const cms=[];POSTS.forEach(p=>p.comments.forEach(c=>{if(c.reports>0||c.blind)cms.push({p,c})}));
  $('#adm').innerHTML=`<div class="chips" style="padding:12px 16px"><button class="chip" type="button" data-pf="reported" aria-pressed="${S.postFilter==='reported'}">신고·가린 글</button><button class="chip" type="button" data-pf="all" aria-pressed="${S.postFilter==='all'}">전체 글 ${POSTS.filter(vis).length}</button></div>
  <ul class="alist">${list.map(p=>`<li class="arow"><div class="t"><b>${esc(p.title)}</b><small>${esc(BOARDS[p.board].name)} · ${esc(p.author)} · ${ago(p.ago)}${p.reports?` · 신고 ${p.reports}`:''}</small></div>${p.blind?'<span class="tag warn">가림</span>':p.reports?'<span class="tag bad">신고</span>':'<span class="tag ok">공개</span>'}<div class="acts"><button class="btn sm" type="button" data-blind="${p.id}">${p.blind?'다시 보이기':'가리기'}</button><button class="btn sm danger" type="button" data-del="${p.id}">삭제</button></div></li>`).join('')||'<li class="empty"><strong>처리할 글이 없어요</strong>신고가 들어오면 여기에 모여요.</li>'}</ul>
  <div class="sec-h"><h2>신고된 댓글</h2></div>
  <ul class="alist">${cms.map(({p,c})=>`<li class="arow"><div class="t"><b>${esc(c.text)}</b><small>${esc(c.author)} · 글: ${esc(p.title)} · 신고 ${c.reports}</small></div>${c.blind?'<span class="tag warn">가림</span>':'<span class="tag bad">신고</span>'}<div class="acts"><button class="btn sm" type="button" data-cblind="${p.id}:${c.id}">${c.blind?'다시 보이기':'가리기'}</button></div></li>`).join('')||'<li class="empty"><strong>신고된 댓글이 없어요</strong></li>'}</ul>`;
}
function admNotice(){
  const pinned=POSTS.filter(p=>p.notice&&vis(p)),cand=POSTS.filter(p=>!p.notice&&vis(p)&&!p.blind).slice(0,8);
  $('#adm').innerHTML=`<div class="sec-h"><h2>지금 고정된 공지 ${pinned.length}</h2></div>
  <ul class="alist">${pinned.map(p=>`<li class="arow">${ic('pin')}<div class="t"><b>${esc(p.title)}</b><small>홈과 모든 게시판 맨 위에 보여요</small></div><div class="acts"><button class="btn sm" type="button" data-pin="${p.id}">고정 풀기</button></div></li>`).join('')||'<li class="empty"><strong>고정된 공지가 없어요</strong></li>'}</ul>
  <div class="sec-h"><h2>공지로 올릴 글 고르기</h2></div>
  <ul class="alist">${cand.map(p=>`<li class="arow"><div class="t"><b>${esc(p.title)}</b><small>${esc(boardLabel(p))} · ${esc(p.author)}</small></div><div class="acts"><button class="btn sm" type="button" data-pin="${p.id}">공지로 고정</button></div></li>`).join('')}</ul>`;
}
function admBanner(){
  const n=BANNERS.length;
  $('#adm').innerHTML=`<div class="sec-h"><h2>홈 배너 순서</h2><span class="updated">위에서부터 보여요</span></div>
  <ul class="alist">${BANNERS.map((b,i)=>`<li class="arow ${b.on?'':'off'}"><span class="num">${i+1}</span><div class="ord"><button type="button" data-bup="${i}" aria-label="${esc(b.title)} 위로" ${i===0?'disabled':''}>${ic('up')}</button><button type="button" data-bdn="${i}" aria-label="${esc(b.title)} 아래로" ${i===n-1?'disabled':''}>${ic('down')}</button></div><img src="${U(b.img,200)}" alt=""><div class="t"><b>${esc(b.title)}</b><small>연결: ${esc(b.link)}</small></div><button class="toggle" type="button" role="switch" aria-checked="${b.on}" aria-label="${esc(b.title)} 보이기" data-bon="${i}"></button><button class="btn sm danger" type="button" data-bdel="${i}">삭제</button></li>`).join('')}</ul>
  <div class="pad"><div class="card pad"><h3 style="margin:0 0 12px;font-size:1.06rem">새 배너 추가</h3>
    <div class="field"><span class="lab">이미지 <span class="req">*</span></span><div class="thumbs" style="grid-template-columns:repeat(2,1fr)" id="bimg"><label class="add">${ic('image')}<span>이미지 고르기</span><input class="sr" type="file" id="bfile" accept="image/*"></label></div><p class="help">가로 16:10 비율이 가장 잘 맞아요.</p></div>
    <div class="field"><label for="bt">문구 <span class="req">*</span></label><input class="inp" id="bt" maxlength="30" placeholder="예) 겨울 온천 여행 후기 모음"></div>
    <div class="field"><label for="bl">누르면 갈 곳</label><select class="inp" id="bl"><option value="#board/abroad">해외여행 게시판</option><option value="#board/domestic">국내여행 게시판</option><option value="#board/lounge">여행 라운지</option><option value="#post/1">이용 규칙 공지</option></select></div>
    <div class="errmsg" id="be" hidden>이미지와 문구를 모두 넣어 주세요</div>
    <button class="btn primary" type="button" data-badd>배너 추가하기</button></div></div>`;
  admBannerRebind();
}
function admBannerRebind(){const f=$('#bfile');if(f)f.onchange=e=>{const x=e.target.files[0];if(!x)return;S._bpick=URL.createObjectURL(x);$('#bimg').querySelector('.th')?.remove();$('#bimg').insertAdjacentHTML('afterbegin',`<div class="th"><img src="${S._bpick}" alt="고른 배너 이미지"></div>`)}}
function refreshAdm(){const k=view.scrollTop;vAdmin();view.scrollTop=k}
function admClick(e){const t=e.target,q=s=>t.closest(s);let x;
  if(x=q('[data-at]')){S.admTab=x.dataset.at;return vAdmin()}
  if(x=q('[data-mf]')){S.memFilter=x.dataset.mf;return refreshAdm()}
  if(x=q('[data-pf]')){S.postFilter=x.dataset.pf;return refreshAdm()}
  if(x=q('[data-sus]')){const nick=x.dataset.sus;return sheet(`<h3>${esc(nick)} 님 이용 제한</h3><p>정지 기간이 끝나면 자동으로 풀려요. 영구 차단은 같은 정보로 다시 가입할 수 없어요.</p>
      <div class="field"><span class="lab">기간</span><div class="chips" style="padding:0;flex-wrap:wrap">${['3일','7일','30일','영구 차단'].map((d,i)=>`<button class="chip" type="button" data-per="${d}" aria-pressed="${i===1}">${d}</button>`).join('')}</div></div>
      <div class="field"><label for="rs">사유 (회원에게 보여요)</label><select class="inp" id="rs"><option>광고·홍보 글</option><option>욕설·비방</option><option>도배</option><option>개인 연락처 공유</option></select></div>
      <div class="btns"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" data-x>적용하기</button></div>`,ev=>{const pc=ev.target.closest('[data-per]');if(pc){layer.querySelectorAll('[data-per]').forEach(b=>b.setAttribute('aria-pressed',b===pc));return}
      if(!ev.target.closest('[data-x]'))return;const per=layer.querySelector('[data-per][aria-pressed="true"]').dataset.per;const m=MEMBERS.find(m=>m.nick===nick);
      if(per==='영구 차단'){m.status='ban';delete m.until}else{m.status='stop';const d=new Date(TODAY);d.setDate(d.getDate()+parseInt(per));m.until=fmtD(d)}m.reason=$('#rs').value;closeLayer();refreshAdm();toast(`${nick} 님을 ${per==='영구 차단'?'영구 차단':per+' 정지'}했어요`)})}
  if(x=q('[data-unsus]')){const m=MEMBERS.find(m=>m.nick===x.dataset.unsus);m.status='ok';delete m.until;delete m.reason;refreshAdm();return toast(`${m.nick} 님 제한을 풀었어요`)}
  if(x=q('[data-blind]')){const p=POSTS.find(p=>p.id===+x.dataset.blind);p.blind=!p.blind;refreshAdm();return toast(p.blind?'글을 가렸어요. 목록에는 \'가린 글\'로 보여요':'글을 다시 보이게 했어요')}
  if(x=q('[data-cblind]')){const [pid,cid]=x.dataset.cblind.split(':').map(Number);const c=POSTS.find(p=>p.id===pid).comments.find(c=>c.id===cid);c.blind=!c.blind;refreshAdm();return toast(c.blind?'댓글을 가렸어요':'댓글을 다시 보이게 했어요')}
  if(x=q('[data-del]')){const p=POSTS.find(p=>p.id===+x.dataset.del);return sheet(`<h3>이 글을 삭제할까요?</h3><p>'${esc(p.title)}'<br>삭제한 글은 회원에게 보이지 않아요. 실제 서비스에서는 30일 동안 복구할 수 있게 둬요.</p><div class="btns"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" data-x style="background:var(--bad);border-color:var(--bad)">삭제하기</button></div>`,ev=>{if(ev.target.closest('[data-x]')){p.deleted=true;closeLayer();vAdmin();toast('글을 삭제했어요')}})}
  if(x=q('[data-pin]')){const p=POSTS.find(p=>p.id===+x.dataset.pin);p.notice=!p.notice;refreshAdm();return toast(p.notice?'공지로 고정했어요. 홈 맨 위에 보여요':'공지 고정을 풀었어요')}
  if(x=q('[data-bup]')){const i=+x.dataset.bup;[BANNERS[i-1],BANNERS[i]]=[BANNERS[i],BANNERS[i-1]];S.slide=0;return refreshAdm()}
  if(x=q('[data-bdn]')){const i=+x.dataset.bdn;[BANNERS[i+1],BANNERS[i]]=[BANNERS[i],BANNERS[i+1]];S.slide=0;return refreshAdm()}
  if(x=q('[data-bon]')){const b=BANNERS[+x.dataset.bon];b.on=!b.on;S.slide=0;refreshAdm();return toast(b.on?'배너를 켰어요':'배너를 껐어요')}
  if(x=q('[data-bdel]')){const i=+x.dataset.bdel;const b=BANNERS[i];return sheet(`<h3>배너를 삭제할까요?</h3><p>'${esc(b.title)}'</p><div class="btns"><button class="btn" type="button" data-close>닫기</button><button class="btn primary" type="button" data-x style="background:var(--bad);border-color:var(--bad)">삭제하기</button></div>`,ev=>{if(ev.target.closest('[data-x]')){BANNERS.splice(i,1);S.slide=0;closeLayer();refreshAdm();toast('배너를 삭제했어요')}})}
  if(q('[data-badd]')){const title=$('#bt').value.trim();if(!S._bpick||!title){$('#be').hidden=false;return}
    BANNERS.push({id:Date.now(),title,sub:'',img:S._bpick,link:$('#bl').value,on:true});S._bpick=null;refreshAdm();return toast('배너를 추가했어요. 홈에서 확인해 보세요')}
}


/* ---------- 공통 클릭 (data-go, data-link, 슬라이드) ---------- */
view.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.stopPropagation();return go(g.dataset.go)}
  const l=e.target.closest('[data-link]');if(l)return go(l.dataset.link.replace('#',''));
  const s=e.target.closest('[data-sl]');if(s){slideBy(+s.dataset.sl);startAuto();return}
  if(e.target.closest('[data-act="write"]')){const r=route();const k=r.name==='board'?r.arg:'lounge';const st=S.boardState[k];const B=BOARDS[k];startWrite(k,B.regions[st.region],B.cats?B.cats[st.cat]:'')}
},true);

/* ---------- 바로가기 (PC 왼쪽 / 휴대폰 시트) ---------- */
const SHORT=[['home','홈','배너·세 게시판·인기글'],['board/abroad','해외여행 게시판','지역 탭·분류 칩'],['post/2','글 보기','사진·좋아요·댓글·답글'],['board/lounge','여행 라운지','사진 갤러리 포함'],['search','검색','검색어 강조·0건 화면'],['write','글쓰기','사진 여러 장 미리보기'],['join','가입','카카오·네이버·성인 확인'],['my','내 정보','내 글·댓글·탈퇴'],['admin','관리자','회원·신고·공지·배너']];
function goShort(h){closeLayer();if(h==='write'){if(!S.user)login('은퇴후여행');return startWrite('abroad','다낭·호이안','후기')}if(h==='join'){S.user=null;S.join={step:'start',via:'',birth:null,agree:{}}}if(h==='my'&&!S.user)login('은퇴후여행');go(h)}
$('#sideNav').innerHTML=SHORT.map(([h,l,d])=>`<button class="go" type="button" data-h="${h}"><span>${l}</span><small>${d}</small></button>`).join('');
$('#sideNav').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b)goShort(b.dataset.h)});
document.querySelector('.callouts').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b)goShort(b.dataset.h)});
$('#mNav').addEventListener('click',()=>sheet(`<h3>화면 목록</h3><div>${SHORT.map(([h,l,d])=>`<button class="go" type="button" data-h="${h}" style="display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;font-size:1rem"><span>${l}</span><small style="color:var(--mut);font-size:.82rem">${d}</small></button>`).join('')}</div><div class="btns one" style="margin-top:12px"><button class="btn" type="button" data-close>닫기</button></div>`,e=>{const b=e.target.closest('[data-h]');if(b)goShort(b.dataset.h)}));

renderSideFs();S.hist.push(location.hash||'#home');render();
</script>
</body>
</html>
